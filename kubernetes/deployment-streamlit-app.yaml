apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit-app
  namespace: llmsearchindex
  labels:
    app.kubernetes.io/name: streamlit-app
    app.kubernetes.io/part-of: llmsearchindex
    app.kubernetes.io/managed-by: autopoc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: streamlit-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streamlit-app
        app.kubernetes.io/part-of: llmsearchindex
    spec:
      containers:
        - name: streamlit-app
          image: quay.io/aicatalyst/llmsearchindex-streamlit-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
              protocol: TCP
          env:
            - name: HF_HOME
              value: /data/hf_cache
            - name: TRANSFORMERS_CACHE
              value: /data/hf_cache
            - name: SENTENCE_TRANSFORMERS_HOME
              value: /data/hf_cache/sentence-transformers
          resources:
            requests:
              memory: 4Gi
              cpu: 2000m
            limits:
              memory: 8Gi
              cpu: 4000m
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 300
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: streamlit-app-data
